name: Daily FIRMS update and deploy

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC daily, after the overnight VIIRS passes are processed
  workflow_dispatch:
    inputs:
      sensitivity:
        description: "Also recompute the clustering sensitivity table"
        type: boolean
        default: false

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new FIRMS data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m pipeline.run update
      - name: Clustering sensitivity (optional)
        if: ${{ github.event.inputs.sensitivity == 'true' }}
        run: python -m pipeline.run sensitivity
      - name: Build dataset and site payloads
        run: python -m pipeline.run build
      - name: Commit updated data
        run: |
          git config user.name "firms-bot"
          git config user.email "firms-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: FIRMS update $(date -u +%Y-%m-%d)" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
